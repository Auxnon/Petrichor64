# Installable builds: two Android APKs and two Linux packages.
#
#   android studio   the studio, no game baked in (`just android-apk -`)
#   android player   no studio; plays a game dragged onto it or picked with
#                    the file dialog (`just android-apk +`), or has one baked
#                    in when the run is given a game (`just android-apk <game>`)
#   linux appimage   the studio, windowed (`just appimage`)
#   linux flatpak    the terminal `chor` (`just flatpak-tui`)
#
# Pushing a `v*` tag makes the release: everything is built and published as
# a GitHub release of that name, with that version's section of CHANGELOG.md
# as its notes (`git tag v0.5.0 && git push origin v0.5.0`).
#
# It also runs without releasing when asked (Actions -> Packages -> Run
# workflow, which can take a game to bake into the player) and on any `ci/**`
# branch, for working on this file.
#
# The APKs are signed with a throwaway key made during the run unless the
# repository has these secrets, in which case that key is used and one build
# can be installed over another:
#   ANDROID_KEYSTORE_BASE64     `base64 -w0 your.keystore`
#   ANDROID_KEYSTORE_PASSWORD
# Both APKs have the same package id, so a phone holds one of them at a time.
name: Packages

on:
  workflow_dispatch:
    inputs:
      game:
        description: Game folder to bake into the Android player (empty for the standalone player)
        default: ""
  push:
    tags: ["v*"]
    branches: ["ci/**"]

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # What a windowed or audio build of `chor` needs to compile on Ubuntu.
  LINUX_DEPS: >-
    pkg-config libasound2-dev libudev-dev libxcb1-dev libxcb-shape0-dev
    libxcb-xfixes0-dev libxkbcommon-dev libwayland-dev

jobs:
  android:
    name: android ${{ matrix.variant }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [studio, player]
    env:
      GAME: ${{ inputs.game }}
      # android/Bridge.java must compile: an APK without it takes no drags
      # and has no file picker.
      PETRICHOR_BRIDGE: require
    steps:
      - uses: actions/checkout@v5
      - name: System libraries
        # A baked-in game is packed with a host `chor` before cross-compiling.
        if: matrix.variant == 'player' && inputs.game != ''
        run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      - run: rustup target add aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-${{ matrix.variant }}
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-apk
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "CARGO_APK_RELEASE_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "CARGO_APK_RELEASE_KEYSTORE_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
          else
            echo "no ANDROID_KEYSTORE_BASE64 secret: signing with a throwaway key"
          fi
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          TARGET=-
          [ "${{ matrix.variant }}" = player ] && TARGET="${GAME:-+}"
          just android-apk "$TARGET" 2>&1 | tee build.log
      - name: Why it failed
        # The end of the build log as an annotation, so it shows on the run's
        # summary page without opening the job's log.
        if: failure()
        run: |
          [ -f build.log ] || exit 0
          TAIL="$(tail -n 40 build.log | sed 's/\x1b\[[0-9;]*m//g')"
          TAIL="${TAIL//'%'/'%25'}"; TAIL="${TAIL//$'\n'/'%0A'}"; TAIL="${TAIL//$'\r'/}"
          echo "::error title=android ${{ matrix.variant }}::$TAIL"
      - name: Name the APK
        run: |
          VERSION="$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)"
          NAME="petrichor64-studio-$VERSION"
          [ "${{ matrix.variant }}" = player ] && NAME="petrichor64-player-$VERSION"
          [ "${{ matrix.variant }}" = player ] && [ -n "$GAME" ] && NAME="petrichor64-$(basename "$GAME")-$VERSION"
          mkdir -p out
          cp "$(find target/release/apk -name '*.apk' | head -1)" "out/$NAME.apk"
          ls -la out
      - uses: actions/upload-artifact@v5
        with:
          name: android-${{ matrix.variant }}
          path: out/*.apk
          if-no-files-found: error

  appimage:
    name: linux studio appimage
    # The oldest runner there is, for the oldest glibc: the AppImage runs on
    # anything at least that new.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      - uses: Swatinem/rust-cache@v2
        with:
          key: appimage
      - run: build-tools/appimage.sh
      - uses: actions/upload-artifact@v5
        with:
          name: linux-appimage
          path: target/appimage/*.AppImage
          if-no-files-found: error

  flatpak:
    name: linux tui flatpak
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS flatpak
      - uses: Swatinem/rust-cache@v2
        with:
          key: flatpak
          workspaces: ". -> target/tui"
      - name: Flatpak runtime
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.freedesktop.Platform//25.08
      - run: build-tools/flatpak-tui.sh
      - uses: actions/upload-artifact@v5
        with:
          name: linux-flatpak
          path: target/flatpak/*.flatpak
          if-no-files-found: error

  release:
    name: publish the release
    needs: [android, appimage, flatpak]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: files
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # The version's own section of the changelog, if it has one.
          awk -v want="## ${TAG#v}" '
            /^## / { on = ($0 == want); next }
            on' CHANGELOG.md > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG exists: replacing its files"
          elif [ -s notes.md ]; then
            gh release create "$TAG" --title "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" --clobber files/*
