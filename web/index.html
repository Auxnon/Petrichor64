<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Petrichor64 (web)</title>
    <!-- Build the crate to wasm. Trunk runs `cargo build` for the wasm target,
         then wasm-bindgen, and injects the loader. The bin's main() is the entry. -->
    <!-- data-wasm-opt-params: modern rustc emits the standardized wasm feature
         set (bulk-memory, nontrapping-fptoint, sign-ext, …); wasm-opt rejects
         those ops unless the features are enabled. Enable them so optimization
         stays on (vs. disabling wasm-opt). Enabling extra features is harmless —
         it only permits ops, it doesn't inject them. All are baseline in modern
         browsers. -->
    <link data-trunk rel="rust" href="../Cargo.toml" data-bin="Petrichor64" data-type="main" data-cargo-features="wasm" data-wasm-opt-params="--enable-bulk-memory --enable-nontrapping-float-to-int --enable-sign-ext --enable-mutable-globals --enable-multivalue --enable-reference-types" />
    <!-- copy the VM worker script into dist so it's served at /worker.js -->
    <link data-trunk rel="copy-file" href="worker.js" />
    <!-- The AudioWorklet synth: the processor module, plus the small synth wasm
         and its wasm-bindgen glue (the worklet imports the glue, and the main
         thread fetches the .wasm to compile and hand over — AudioWorkletGlobalScope
         has no fetch of its own). Generated by `just synth-wasm`, which the web
         recipes depend on. -->
    <link data-trunk rel="copy-file" href="synth-worklet.js" />
    <!-- TextDecoder/TextEncoder shims: the worklet scope has neither, and the
         wasm-bindgen glue builds one at module top level. -->
    <link data-trunk rel="copy-file" href="worklet-polyfill.js" />
    <link data-trunk rel="copy-file" href="synth/petrichor_synth.js" />
    <link data-trunk rel="copy-file" href="synth/petrichor_synth_bg.wasm" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #111;
        overflow: hidden;
      }
      /* winit appends its canvas to <body>; make it fill the viewport. */
      canvas {
        display: block;
        margin: 0 auto;
        image-rendering: pixelated; /* keep the low-res console look crisp */
      }
      /* winit makes the canvas focusable (tabindex) to receive keyboard input;
         hide the browser's focus ring so it doesn't draw an accessibility box. */
      canvas:focus,
      canvas:focus-visible {
        outline: none;
      }
    </style>
  </head>
  <body>
    <!-- The engine (main-thread wasm) now spawns and drives the VM worker
         itself (§4d) — see about_to_wait in lib.rs. No JS spawner needed. -->
  </body>
</html>
