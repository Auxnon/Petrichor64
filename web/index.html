<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Petrichor64 (web)</title>
    <!-- Build the crate to wasm. Trunk runs `cargo build` for the wasm target,
         then wasm-bindgen, and injects the loader. The bin's main() is the entry. -->
    <link data-trunk rel="rust" data-bin="Petrichor64" data-type="main" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #111;
        overflow: hidden;
      }
      /* winit appends its canvas to <body>; make it fill the viewport. */
      canvas {
        display: block;
        margin: 0 auto;
        image-rendering: pixelated; /* keep the low-res console look crisp */
      }
    </style>
  </head>
  <body></body>
</html>
