<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Petrichor64 (web)</title>
    <!-- Build the crate to wasm. Trunk runs `cargo build` for the wasm target,
         then wasm-bindgen, and injects the loader. The bin's main() is the entry. -->
    <link data-trunk rel="rust" href="../Cargo.toml" data-bin="Petrichor64" data-type="main" />
    <!-- copy the VM worker script into dist so it's served at /worker.js -->
    <link data-trunk rel="copy-file" href="worker.js" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #111;
        overflow: hidden;
      }
      /* winit appends its canvas to <body>; make it fill the viewport. */
      canvas {
        display: block;
        margin: 0 auto;
        image-rendering: pixelated; /* keep the low-res console look crisp */
      }
      /* winit makes the canvas focusable (tabindex) to receive keyboard input;
         hide the browser's focus ring so it doesn't draw an accessibility box. */
      canvas:focus,
      canvas:focus-visible {
        outline: none;
      }
    </style>
  </head>
  <body>
    <!-- §4c transport spike: spawn the VM worker and round-trip a test message
         through wasm-in-worker + postMessage. Watch the console for
         "[petrichor worker] …" logs and the "vm" reply. -->
    <script type="module">
      const worker = new Worker("/worker.js", { type: "module" });
      worker.onmessage = (e) => {
        console.log("[main] from worker:", e.data);
        if (e.data && e.data.kind === "worker-ready") {
          // send a test Loop frame (256 zero keys, 11 zero analog values)
          worker.postMessage({
            Loop: { keys: new Array(256).fill(0), analog: new Array(11).fill(0) },
          });
        }
      };
      worker.onerror = (e) => console.error("[main] worker error:", e.message, e);
    </script>
  </body>
</html>
