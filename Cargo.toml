
[package]
name = "Petrichor64"
version = "0.4.3"
edition = "2021"
resolver = "2"
description = "Cross platform lua interpreting game engine"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
strip = true  # Automatically strip symbols from the binary.
opt-level = "z"  # Optimize for size.
lto = true
panic ="abort"

[profile.release-nightly]
inherits = "release"

[features]
default=[ "silt","headed","wasm"] # "online_capable" ,  "headed"
include_auto=["studio"]
online_capable=["tokio/full", "tokio-util", "rmp-serde", "bytes"]
wasm=["tokio/full", "tokio-util/compat"]
headed=["wgpu", "winit", "winit_input_helper"]
audio=["cpal"]
puc_lua=["mlua"]
silt=["silt-lua"]
picc=["piccolo"]
studio=[]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
#wgpu = { version = "0.12", features = ["webgl"],optional=true }
wgpu = { version = "29.0.1", optional=true }
cpal={ version ="0.16.0", optional=true }
bytemuck= { version = "1.21.0", features = ["derive"] }
bytes={version="1.10.0", optional=true}

winit = { version ="0.30.13",  optional=true }
winit_input_helper={ version ="0.17.0", optional=true }
pollster = "0.4.0"
log="0.4.28"
env_logger = "0.11.8"
lazy_static="1.5.0"
parking_lot ="0.12.4"
anyhow="1.0.100"
image ="0.25.5"


# used by imageproc
getrandom = {version="0.3.3", features=["wasm_js"]}

imageproc="0.26.0"
gltf="1.4.1"
itertools="0.14.0"
serde={version="1.0.219",features=["derive"]}

mlua={version= "0.10.3", optional=true, features=["luau"]}
fastrand={version="2.3.0", features=["js"]}


# rand={version="0.9.2",features=["wasm_js"]}
glam="0.30.0"
rmp-serde={version="1.3.0",optional=true}

# uuid = {version="0.8.2",features = ["serde", "v4"]}
# futures="0.3.31"
# zip="2.2.2"
async_zip = { version = "0.0.18", features = ["lzma","tokio"] }

# used by async_zip, matching their version hopefully
# futures-lite={version="2.1.0", features = ["std"]}
# default-features = false

spin_sleep = "1.3.0"
clipboard = "0.5.0"
rustc-hash = "2.1.1"
ron="0.8.1"
gilrs ="0.10.10"
serde_json ="1.0.139"
tokio = { version = "1.43.0", features = ["full"], optional=true }
tokio-util= { version = "0.7.13", features = ["codec"],optional=true } 
dirs="6.0.0"

regex="1.11.1"
native-dialog = "0.9.0"
silt-lua = {version="0.3.0", optional=true, path="../silt-lua"}
piccolo = { git="https://github.com/kyren/piccolo", optional=true } # version="0.2.0",
# gc-arena = {git="https://github.com/kyren/gc-arena"}
crossbeam = "0.8.4"
atomicell = "0.2.0"
# wasm-bindgen = "0.2.83"

