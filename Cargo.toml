
[package]
name = "Petrichor64"
version = "0.4.3"
edition = "2021"
resolver = "2"
description = "Cross platform lua interpreting game engine"

[lib]
# Distinct from the "Petrichor64" bin so wasm tooling (trunk/wasm-bindgen) can
# tell the two build artifacts apart.
name = "petrichor64"
crate-type = ["cdylib", "rlib"]

[profile.release]
strip = true  # Automatically strip symbols from the binary.
opt-level = "z"  # Optimize for size.
lto = true
panic ="abort"

[profile.release-nightly]
inherits = "release"

[features]
default=[ "silt","headed"] # "online_capable" ,  "headed" , "include_auto"
include_auto=["studio"]
online_capable=["rmp-serde", "bytes"]
# `wasm` marks a wasm build (drop-in, CDN-friendly, no shared memory). NOT in
# default — native builds must never enable it. tokio/tokio-util are non-optional
# now (needed by async_zip on both targets), so this pulls no deps itself.
wasm=[]
# `wasm-ultra` is the high-performance wasm build: SharedArrayBuffer + wasm
# atomics for a shared entity buffer (requires COOP/COEP isolation headers on the
# host page). Additive over `wasm`; ultra-only code gates on feature="wasm-ultra",
# shared wasm code stays on cfg(target_arch="wasm32").
wasm-ultra=["wasm"]
headed=["wgpu", "winit", "winit_input_helper"]
audio=["cpal"]
puc_lua=["mlua"]
silt=["silt-lua"]
picc=["piccolo"]
studio=[]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
#wgpu = { version = "0.12", features = ["webgl"],optional=true }
wgpu = { version = "29.0.3", optional=true }
cpal={ version ="0.16.0", optional=true }
bytemuck= { version = "1.21.0", features = ["derive"] }
bytes={version="1.10.0", optional=true}

winit = { version ="0.30.13",  optional=true }
winit_input_helper={ version ="0.17.0", optional=true }
pollster = "0.4.0"
log="0.4.28"
env_logger = "0.11.8"
lazy_static="1.5.0"
parking_lot ="0.12.4"
anyhow="1.0.100"
image ="0.25.5"
colored="3.1.1"


# used by imageproc
getrandom = {version="0.3.3", features=["wasm_js"]}

imageproc="0.26.0"
gltf="1.4.1"
itertools="0.14.0"
serde={version="1.0.219",features=["derive"]}

mlua={version= "0.10.3", optional=true, features=["luau"]}
fastrand={version="2.3.0", features=["js"]}


# rand={version="0.9.2",features=["wasm_js"]}
glam="0.30.0"
rmp-serde={version="1.3.0",optional=true}

# uuid = {version="0.8.2",features = ["serde", "v4"]}
# futures="0.3.31"
# zip="2.2.2"
# lzma was dropped: only Compression::Stored is used (see file_util.rs), and the
# lzma feature pulls liblzma-sys, a C library with no wasm target.
async_zip = { version = "0.0.18", features = ["tokio"] }

# used by async_zip, matching their version hopefully
# futures-lite={version="2.1.0", features = ["std"]}
# default-features = false

spin_sleep = "1.3.0"
rustc-hash = "2.1.1"
ron="0.8.1"
gilrs ="0.10.10"
serde_json ="1.0.139"
# tokio/tokio-util are needed on BOTH targets (async_zip, file_util's compat
# readers, native pack_zip/run_cli), so they're non-optional. The base carries
# only the wasm-safe pieces; "full" (which pulls mio/net and won't build on wasm)
# is added for native targets below.
tokio = { version = "1.43.0", features = ["sync", "macros", "io-util", "rt"] }
tokio-util = { version = "0.7.13", features = ["codec", "compat"] }
dirs="6.0.0"

regex="1.11.1"
# silt-lua = {version="0.3.0", optional=true, git="https://github.com/auxnon/silt-lua", branch="copilot/sub-pr-10-again"}
silt-lua = {version="0.3.0", optional=true, path="../silt-stable"}
piccolo = { git="https://github.com/kyren/piccolo", optional=true } # version="0.2.0",
# gc-arena = {git="https://github.com/kyren/gc-arena"}
crossbeam = "0.8.4"
atomicell = "0.2.0"

# ---------------------------------------------------------------------------
# Native-only dependencies: desktop crates with no wasm support. Their call
# sites are gated behind cfg(not(target_arch = "wasm32")) in the source.
# ---------------------------------------------------------------------------
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
clipboard = "0.5.0"
native-dialog = "0.9.0"
# native tokio gets the full runtime (threads, net, fs); wasm keeps the reduced
# feature set declared in [dependencies]. Features union across target tables.
tokio = { version = "1.43.0", features = ["full"] }

# ---------------------------------------------------------------------------
# wasm-only dependencies: browser glue for the web build.
# ---------------------------------------------------------------------------
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
console_log = "1.0"
js-sys = "0.3"
# JsValue <-> serde for postMessage payloads (HostToVm / VmToHost).
serde-wasm-bindgen = "0.6"
# winit uses web-time's Instant on wasm; match it for our frame pacing.
web-time = "1.1"
web-sys = { version = "0.3", features = [
    "console",
    "Document",
    "Window",
    "Element",
    "Node",
    "HtmlElement",
    "HtmlCanvasElement",
    "Location",
    "Request",
    "RequestInit",
    "Response",
    "Worker",
    "WorkerType",
    "WorkerOptions",
    "MessageEvent",
] }

