[package]
name = "petrichor-synth"
version = "0.1.0"
edition = "2021"
description = "Petrichor64's synth: pure-DSP mixer, effects and formant voice, plus optional host I/O"

# Why this is its own crate: the engine and the browser AudioWorklet both need the
# synth, and the worklet must be a *small* wasm module — no wgpu, no Lua VM, no
# asset pipeline. Splitting the DSP out means one source of truth for both, rather
# than a copy that drifts. The DSP here is I/O-free by default; the cpal and
# WebAudio glue is feature-gated so the worklet build compiles none of it.
[lib]
crate-type = ["lib", "cdylib"]

[features]
default = []
# Host audio I/O via cpal (native output stream + microphone capture) and the
# main-thread WebAudio fallback. The engine turns this on; the worklet does not.
host-io = ["cpal", "anyhow"]
# The browser's main-thread scheduler (`WebAudioOut`), used only when the
# AudioWorklet path can't start. It runs the mixer on the main thread, so leaving
# it in compiles the *whole* DSP — mixer, effects, formant voice — into the engine's
# own wasm as well as the worklet's, where it is otherwise dead code. Off means a
# browser that can't run the worklet gets no sound at all, so keep it on unless
# bundle size is the overriding concern. wasm-only; no effect on native builds.
web-fallback = []
# The AudioWorklet entry point (`worklet::Synth`). Enabled only by the wasm-pack
# build that produces the worklet's own module — see `just synth-wasm`. The engine
# depends on this crate too, and there `Synth` is unreachable, so building it in
# only kept the DSP alive as live code.
worklet = []
# JACK host on Linux/BSD (the cpal init path checks for it). Declared so the
# `feature = "jack"` cfgs in sound.rs are recognised rather than warned about.
jack = []

# Modern rustc emits the standardized wasm feature set (bulk-memory, sign-ext, …)
# and wasm-opt rejects those ops unless the features are enabled — the same
# workaround web/index.html applies to the engine's own build. Enabling features
# only permits ops, it never injects them; all are baseline in modern browsers.
[package.metadata.wasm-pack.profile.release]
wasm-opt = [
    '-O',
    '--enable-bulk-memory',
    '--enable-nontrapping-float-to-int',
    '--enable-sign-ext',
    '--enable-mutable-globals',
    '--enable-multivalue',
    '--enable-reference-types',
]

[dependencies]
serde = { version = "1.0.219", features = ["derive"] }
rustc-hash = "2.1.1"
log = "0.4.28"
cpal = { version = "0.16.0", optional = true }
anyhow = { version = "1.0.100", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# cpal needs wasm-bindgen to see a WebAudio device at all (see the engine's
# Cargo.toml); features union with the optional dep above.
cpal = { version = "0.16.0", optional = true, features = ["wasm-bindgen"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
# SoundCommands reach the AudioWorklet as MessagePack bytes. A binary codec (not
# JSON or JS objects) matters because a command can carry a whole decoded ogg as
# Vec<f32> — as a JS array that would be one boxed number per sample.
rmp-serde = "1.3.0"
web-sys = { version = "0.3", features = [
    "AudioContext",
    "AudioContextState",
    "BaseAudioContext",
    "AudioBuffer",
    "AudioBufferSourceNode",
    "AudioNode",
    "AudioScheduledSourceNode",
    "AudioDestinationNode",
    # AudioWorklet path (webout.rs): register the processor module, create the
    # node, and hand it the compiled wasm over its MessagePort.
    "AudioWorklet",
    "AudioWorkletNode",
    "MessagePort",
    "MessageEvent",
    "Window",
    "Response",
] }
